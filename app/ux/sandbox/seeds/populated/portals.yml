# Sources for the UX sandbox. Every company here is fictional; the sandbox
# serves their boards from app/ux/sandbox/net/ and never touches the network.

title_filter:
  positive:
    - Engineer
    - SRE
    - Developer
  negative:
    - Intern
    - Recruiter
    - Account Executive

